# Live site is hosted on GitHub Pages at https://tskaizen.com (CNAME file at the repo root).
# Netlify is kept only for free Deploy Previews on pull requests.
# Static site. No build step, no dependencies.
# Pages: index, work, about, quote and a 404, all at the repo root. pricing.html redirects to /#pricing.

[build]
  publish = "."

[build.environment]
  # Nothing to install. Keeps Netlify from probing for a package manager.
  NETLIFY_USE_YARN = "false"

# Netlify serves 404.html automatically for unknown paths.

# The old Services page redirects home.
[[redirects]]
  from = "/services.html"
  to = "/#pricing"
  status = 301

# Send the old Netlify address to the real domain so Google only indexes tskaizen.com.
# Matches this host only, so deploy-preview-N--tskaizen.netlify.app links keep working.
[[redirects]]
  from = "https://tskaizen.netlify.app/*"
  to = "https://tskaizen.com/:splat"
  status = 301
  force = true
