# Static site. No build step, no dependencies.
# Pages: index, pricing, work, about, quote and a 404, all at the repo root.

[build]
  publish = "."

[build.environment]
  # Nothing to install. Keeps Netlify from probing for a package manager.
  NETLIFY_USE_YARN = "false"

# Netlify serves 404.html automatically for unknown paths.

# The old Services page now lives on Pricing.
[[redirects]]
  from = "/services.html"
  to = "/pricing.html"
  status = 301
